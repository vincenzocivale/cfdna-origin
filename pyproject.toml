[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cfdna-tissue-origin"
version = "0.1.0"
description = "Read-level tissue-of-origin classification of cfDNA WGBS reads from frozen CpG-locus representations"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "pyarrow", "h5py", "torch", "pyyaml", "scikit-learn", "tqdm"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
