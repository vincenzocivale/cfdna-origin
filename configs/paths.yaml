# Default locations (relative to the repository root). Override per machine in configs/paths.local.yaml
# (gitignored). Values may use ${ENV_VAR} / ${ENV_VAR:-default} and {other_key} references.
data_root: data                     # raw + processed datasets: {data_root}/<dataset>/{meta,raw,processed}
reference_root: "{data_root}/reference"
cache_root: "{data_root}/cache"     # materialised representation tables: {cache_root}/representations/<dataset>/<rep>
outputs_root: outputs               # {outputs_root}/<dataset>/<experiment>/<representation>/seed_<seed>/fold_<k>
# External representation artifacts (canonical /cpg_idx + /embedding HDF5, produced by CpGRepresentationBenchmark)
representations_root: ../CpGRepresentationBenchmark/data/derived
benchmark_repo: ../CpGRepresentationBenchmark
