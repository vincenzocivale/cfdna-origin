# Ablation: same fragment encoder, mean pooling over fragments (mixture-consistent conservative baseline).
name: mean_pool
d_model: 64
token: {dropout: 0.1, keep_min: 3, use_methylation_state: true}
fragment_encoder: {type: set_attention, n_layers: 1, n_heads: 4, ffn_dim: 128, dropout: 0.1, readout: pma}
aggregator: {type: mean, instance_dropout: 0.1}
head_dropout: 0.25
