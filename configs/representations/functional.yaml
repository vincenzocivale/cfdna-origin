# ENCODE functional-annotation representation (CpGRepresentationBenchmark recipe): TruncatedSVD(256) over 4165
# binary ENCODE peak tracks + 23 dense annotation features, every CpG of GRCh38 chr1-22,X,Y (29,401,360 loci).
# Unsupervised, no methylation, no patients. Built by legacy/representation_build/build_genomewide_embedding.py.
name: functional
kind: hdf5
path: "{representations_root}/functional_pca_genomewide_hg38.h5"
id_key: cpg_idx
embedding_key: embedding
normalization: none   # native scale; the experiment-level PCA centres and rescales (not data-derived)
family: functional
